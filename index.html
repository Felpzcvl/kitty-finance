<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ec5a92" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kitty Finance</title>
    <script>
      // aplica o tema salvo antes de renderizar (evita "piscar")
      try {
        var t = localStorage.getItem('kf-theme');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var a = localStorage.getItem('kf-accent');
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
