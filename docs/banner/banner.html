<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Kitty Finance banner</title>
<style>
  @font-face { font-family: Quicksand; font-weight: 700; src: url(../../node_modules/@fontsource/quicksand/files/quicksand-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 600; src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 800; src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Nunito, sans-serif;
    background: radial-gradient(circle at 18% 10%, #ffd9e8 0, transparent 40%),
                radial-gradient(circle at 90% 95%, #ffc6dc 0, transparent 45%),
                linear-gradient(135deg, #fff6f9 0%, #ffe9f1 100%);
    color: #3b2730;
    position: relative;
  }
  .deco { position: absolute; opacity: .55; }
  .left { position: absolute; left: 80px; top: 92px; width: 600px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo span { width: 60px; height: 60px; border-radius: 18px; background: #ec5a92; display: grid; place-items: center; box-shadow: 0 12px 24px -10px #ec5a92; }
  .logo b { font-family: Quicksand; font-size: 28px; color: #b02e62; }
  h1 { font-family: Quicksand; font-weight: 700; font-size: 84px; line-height: 1; margin-top: 30px; letter-spacing: -1.5px; }
  h1 em { font-style: normal; color: #ec5a92; }
  p.sub { font-size: 26px; font-weight: 600; color: #8d6f7c; margin-top: 20px; line-height: 1.35; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .pills span { background: #fff; border: 2px solid #f7dbe6; border-radius: 999px; padding: 8px 18px; font-weight: 800; font-size: 17px; color: #d6407a; }
  .right { position: absolute; right: 70px; top: 70px; width: 470px; height: 500px; }
  .phone { position: absolute; right: 0; top: 40px; width: 330px; background: #fff; border-radius: 34px; padding: 24px; box-shadow: 0 30px 60px -28px rgba(176,46,98,.45); border: 2px solid #f7dbe6; }
  .hero { background: linear-gradient(135deg, #f879a8, #d6407a); color: #fff; border-radius: 22px; padding: 18px 20px; }
  .hero small { font-size: 14px; font-weight: 800; opacity: .85; }
  .hero div { font-family: Quicksand; font-size: 34px; margin-top: 4px; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .stat { flex: 1; border: 2px solid #f7dbe6; border-radius: 18px; padding: 12px 14px; }
  .stat small { font-size: 12px; font-weight: 800; color: #8d6f7c; }
  .stat div { font-family: Quicksand; font-size: 20px; margin-top: 2px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 92px; margin-top: 14px; padding: 0 6px; border-bottom: 2px dashed #f7dbe6; }
  .bars i { flex: 1; border-radius: 8px 8px 2px 2px; }
  .goal { margin-top: 14px; }
  .goal small { font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; }
  .track { height: 12px; background: #fff0f5; border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .track b { display: block; height: 100%; width: 62%; background: #ec5a92; border-radius: 99px; }
  .kitty { position: absolute; left: -90px; top: 290px; width: 230px; filter: drop-shadow(0 18px 24px rgba(176,46,98,.25)); }
</style>
</head>
<body>
  <!-- laços e corações decorativos -->
  <svg class="deco" style="left:620px;top:28px;width:110px;transform:rotate(-14deg)" viewBox="0 0 64 40"><path d="M32 18C25 6 8 0 4 9c-3 7 3 13 12 12-8 3-12 10-7 14 6 4 17-3 23-13 6 10 17 17 23 13 5-4 1-11-7-14 9 1 15-5 12-12-4-9-21-3-28 9z" fill="#ffa1c3"/><ellipse cx="32" cy="20" rx="7" ry="7.5" fill="#f879a8"/></svg>
  <svg class="deco" style="left:40px;bottom:30px;width:34px" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z" fill="#f879a8"/></svg>
  <svg class="deco" style="left:700px;bottom:60px;width:22px" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z" fill="#e0475e"/></svg>
  <svg class="deco" style="right:30px;top:24px;width:26px" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z" fill="#ffa1c3"/></svg>

  <div class="left">
    <div class="logo">
      <span><svg width="40" viewBox="0 0 64 40"><path d="M32 18C25 6 8 0 4 9c-3 7 3 13 12 12-8 3-12 10-7 14 6 4 17-3 23-13 6 10 17 17 23 13 5-4 1-11-7-14 9 1 15-5 12-12-4-9-21-3-28 9z" fill="#fff"/><ellipse cx="32" cy="20" rx="7" ry="7.5" fill="#fff"/></svg></span>
      <b>suas finanças com carinho</b>
    </div>
    <h1>Kitty <em>Finance</em></h1>
    <p class="sub">Receitas, gastos, contas, metas e relatórios num só lugar, com visual delicado em rosa.</p>
    <div class="pills">
      <span>React</span><span>TypeScript</span><span>Tailwind</span><span>Recharts</span><span>Node + Postgres</span>
    </div>
  </div>

  <div class="right">
    <div class="phone">
      <div class="hero"><small>Saldo disponível</small><div>R$ 1.676,26</div></div>
      <div class="row">
        <div class="stat"><small>Receitas</small><div style="color:#2fa27a">R$ 3.200</div></div>
        <div class="stat"><small>Despesas</small><div style="color:#d6407a">R$ 1.748</div></div>
      </div>
      <div class="bars">
        <i style="height:70%;background:#3fae8c"></i><i style="height:42%;background:#ec5a92"></i>
        <i style="height:82%;background:#3fae8c"></i><i style="height:50%;background:#ec5a92"></i>
        <i style="height:74%;background:#3fae8c"></i><i style="height:38%;background:#ec5a92"></i>
        <i style="height:90%;background:#3fae8c"></i><i style="height:55%;background:#ec5a92"></i>
      </div>
      <div class="goal"><small><span>✈ Viagem para a praia</span><span style="color:#ec5a92">62%</span></small><div class="track"><b></b></div></div>
    </div>
    <svg class="kitty" viewBox="0 0 160 140">
      <path d="M26 58 L30 14 Q32 8 38 12 L66 34 Z" fill="#fff" stroke="#3b2730" stroke-width="4" stroke-linejoin="round"/>
      <path d="M134 58 L130 14 Q128 8 122 12 L94 34 Z" fill="#fff" stroke="#3b2730" stroke-width="4" stroke-linejoin="round"/>
      <path d="M36 24 L54 36 L38 44 Z" fill="#ffd0e1"/><path d="M124 24 L106 36 L122 44 Z" fill="#ffd0e1"/>
      <ellipse cx="80" cy="80" rx="66" ry="52" fill="#fff" stroke="#3b2730" stroke-width="4"/>
      <path d="M44 80 q7 -7 14 0" stroke="#3b2730" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="109" cy="80" rx="5.5" ry="7" fill="#3b2730"/><circle cx="111" cy="77" r="1.8" fill="#fff"/>
      <ellipse cx="40" cy="98" rx="10" ry="6" fill="#ffb3cd" opacity=".7"/><ellipse cx="120" cy="98" rx="10" ry="6" fill="#ffb3cd" opacity=".7"/>
      <path d="M74 90 q6 5 12 0 q-6 -4 -12 0z" fill="#f48fb1"/>
      <path d="M80 93 v4 M80 97 q-5 5 -9 1 M80 97 q5 5 9 1" stroke="#3b2730" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M4 82 L28 86 M6 96 L28 94 M156 82 L132 86 M154 96 L132 94" stroke="#3b2730" stroke-width="3.5" stroke-linecap="round"/>
      <g transform="translate(92 6) rotate(14)">
        <path d="M24 18C18 6 4 1 1 9c-2 6 3 11 10 10-6 3-9 8-5 11 5 3 13-3 18-11 5 8 13 14 18 11 4-3 1-8-5-11 7 1 12-4 10-10-3-8-17-3-23 9z" fill="#ec5a92" stroke="#3b2730" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="24" cy="19" rx="6.5" ry="7" fill="#d6407a" stroke="#3b2730" stroke-width="3.5"/>
      </g>
    </svg>
  </div>
</body>
</html>
